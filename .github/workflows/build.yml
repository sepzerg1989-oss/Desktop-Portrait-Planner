name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Set Release File Pattern (macOS)
        if: matrix.os == 'macos-latest'
        run: echo "RELEASE_FILE=dist-release/*.dmg" >> $GITHUB_ENV
        shell: bash

      - name: Set Release File Pattern (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "RELEASE_FILE=dist-release/*.exe" >> $GITHUB_ENV
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: ${{ env.RELEASE_FILE }}

  release:
    name: Auto Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Release Status
        id: check_release
        run: |
          version=$(node -p "require('./package.json').version")
          tag_name="v$version"
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          
          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Release $tag_name already exists. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Release $tag_name does not exist. Creating new release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Build Artifacts
        if: steps.check_release.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts Directory
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          mkdir -p final-release
          find release-artifacts -type f -name "*.dmg" -exec cp {} final-release/ \;
          find release-artifacts -type f -name "*.exe" -exec cp {} final-release/ \;
          ls -R final-release

      - name: Create and Publish Release
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.tag_name }}
          name: Release ${{ steps.check_release.outputs.tag_name }}
          files: final-release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}